# ==============================================================================
# Gazipur Agricultural University High School (GAUHS)
# Netlify Production Configuration (Multi-Page Static Architecture)
# ==============================================================================

[build]
  publish = "."

# Clean URLs & Page Routing
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/administration"
  to = "/administration.html"
  status = 200

[[redirects]]
  from = "/academics"
  to = "/academics.html"
  status = 200

[[redirects]]
  from = "/admission"
  to = "/admission.html"
  status = 200

[[redirects]]
  from = "/notices"
  to = "/notices.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Security Headers & Performance Caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"
