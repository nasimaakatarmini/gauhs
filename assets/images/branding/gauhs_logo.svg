<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="120" cy="120" r="112" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Top Circular Text Path -->
  <path id="topTextPath" d="M 32 120 A 88 88 0 0 1 208 120" fill="none" />
  <text font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fef08a" letter-spacing="1.2">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      GAZIPUR AGRICULTURAL UNIVERSITY HIGH SCHOOL
    </textPath>
  </text>

  <!-- Bottom Circular Text Path -->
  <path id="bottomTextPath" d="M 204 125 A 85 85 0 0 1 36 125" fill="none" />
  <text font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fef08a" letter-spacing="1.5">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      ★ ESTABLISHED 1999 ★ SALNA, GAZIPUR
    </textPath>
  </text>

  <!-- Inner Crest Shield -->
  <circle cx="120" cy="120" r="74" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Sunrise Background -->
  <path d="M 80 115 Q 120 70 160 115 Z" fill="#fbbf24" opacity="0.35"/>
  <!-- Sun Rays -->
  <line x1="120" y1="108" x2="120" y2="78" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="102" y1="110" x2="88" y2="86" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="138" y1="110" x2="152" y2="86" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="88" y1="118" x2="72" y2="102" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  <line x1="152" y1="118" x2="168" y2="102" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>

  <!-- Golden Sun Disc -->
  <circle cx="120" cy="110" r="14" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Agricultural Sprouts / Laurel (Symbol of Agricultural University roots & growth) -->
  <!-- Left stalk -->
  <path d="M 120 128 C 105 125 90 115 84 95 C 88 108 98 116 112 120" fill="#34d399"/>
  <path d="M 86 100 Q 76 96 74 88 Q 84 90 88 98" fill="#a7f3d0"/>
  <path d="M 96 110 Q 86 108 82 100 Q 94 102 98 108" fill="#a7f3d0"/>
  
  <!-- Right stalk -->
  <path d="M 120 128 C 135 125 150 115 156 95 C 152 108 142 116 128 120" fill="#34d399"/>
  <path d="M 154 100 Q 164 96 166 88 Q 156 90 152 98" fill="#a7f3d0"/>
  <path d="M 144 110 Q 154 108 158 100 Q 146 102 142 108" fill="#a7f3d0"/>

  <!-- Open Book of Knowledge -->
  <path d="M 120 134 C 110 126 92 126 78 132 L 80 148 C 94 142 110 142 120 148 C 130 142 146 142 160 148 L 162 132 C 148 126 130 126 120 134 Z" fill="#ffffff" stroke="#064e3b" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Book spine line & pages -->
  <line x1="120" y1="134" x2="120" y2="148" stroke="#064e3b" stroke-width="2"/>
  <line x1="86" y1="137" x2="114" y2="137" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="86" y1="141" x2="112" y2="141" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="126" y1="137" x2="154" y2="137" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="128" y1="141" x2="154" y2="141" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Ribbon Banner at Bottom of Shield -->
  <g id="ribbon">
    <path d="M 68 154 L 172 154 L 162 172 L 120 167 L 78 172 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="120" y="165" font-family="'Inter', system-ui, sans-serif" font-size="11.5" font-weight="900" fill="#064e3b" text-anchor="middle" letter-spacing="1.5">GAUHS</text>
  </g>
</svg>

