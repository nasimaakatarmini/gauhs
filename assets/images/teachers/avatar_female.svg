  <path d="M72 200 C76 165, 93 148, 122 155" fill="none" stroke="#fbbf24" stroke-width="3"/>
  
  <!-- Neck -->
  <rect x="91" y="115" width="18" height="26" rx="5" fill="#fcd34d"/>
  
  <!-- Head / Face -->
  <ellipse cx="100" cy="85" rx="30" ry="36" fill="#fde68a"/>
  
  <!-- Hair (Neat Educator Bun & Front Hair) -->
  <circle cx="100" cy="48" r="18" fill="#1e293b"/>
  <path d="M68 85 C66 50, 80 43, 100 43 C120 43, 134 50, 132 85 C124 68, 114 61, 100 61 C86 61, 76 68, 68 85 Z" fill="#1e293b"/>
  
  <!-- Small Elegant Earrings -->
  <circle cx="68" cy="92" r="3.5" fill="#f59e0b"/>
  <circle cx="132" cy="92" r="3.5" fill="#f59e0b"/>
  
  <!-- Eyes -->
  <ellipse cx="88" cy="83" rx="3" ry="3.5" fill="#1e293b"/>
  <ellipse cx="112" cy="83" rx="3" ry="3.5" fill="#1e293b"/>
  
  <!-- Eyebrows -->
  <path d="M82 77 Q88 74 94 77" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <path d="M106 77 Q112 74 118 77" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Bindi / Professional Dot (Subtle Maroon) -->
  <circle cx="100" cy="74" r="2.5" fill="#991b1b"/>

  <!-- Friendly Smile -->
  <path d="M92 103 Q100 109 108 103" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
