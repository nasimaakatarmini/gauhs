<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Clean institutional slate -->
    <linearGradient id="bgFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    
    <!-- Torso / Blazer Gradient: Executive Dark Slate -->
    <linearGradient id="suitFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Lapel Highlight -->
    <linearGradient id="lapelFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Emerald Scarf / Lapel Accent matching School Primary Branding -->
    <linearGradient id="accentFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    
    <!-- Natural Professional Skin Gradient -->
    <linearGradient id="skinFem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae0cf"/>
      <stop offset="100%" stop-color="#eec5a8"/>
    </linearGradient>
  </defs>

  <!-- Circular Base Frame -->
  <circle cx="128" cy="128" r="126" fill="url(#bgFem)" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- Back Hair Silhouette -->
  <path d="M82 116 C80 148, 84 176, 92 192 C96 174, 95 150, 97 126 Z" fill="#0f172a"/>
  <path d="M174 116 C176 148, 172 176, 164 192 C160 174, 161 150, 159 126 Z" fill="#0f172a"/>

  <!-- Female Torso & Shoulders (Executive Blazer) -->
  <path d="M44 256 C44 200, 78 176, 128 176 C178 176, 212 200, 212 256 Z" fill="url(#suitFem)"/>

  <!-- Tailored Blazer Lapels (Left & Right) -->
  <path d="M80 178 L112 238 L98 256 L54 256 C48 236, 58 204, 80 178 Z" fill="url(#lapelFem)"/>
  <path d="M176 178 L144 238 L158 256 L202 256 C208 236, 198 204, 176 178 Z" fill="url(#lapelFem)"/>

  <!-- Crisp White Inner Blouse / V-Neck -->
  <polygon points="128,176 106,224 150,224" fill="#ffffff"/>

  <!-- Elegant Emerald Scarf Accent -->
  <path d="M112 196 C118 214, 126 228, 132 256 L122 256 C117 232, 110 216, 107 196 Z" fill="url(#accentFem)"/>

  <!-- Neck -->
  <path d="M116 144 L116 182 C120 185, 136 185, 140 182 L140 144 Z" fill="#deb091"/>
  <!-- Shadow under Chin -->
  <path d="M116 144 C122 152, 134 152, 140 144 L140 152 C134 158, 122 158, 116 152 Z" fill="#c99b7b" opacity="0.4"/>

  <!-- Head / Face Silhouette (Faceless Modern Executive) -->
  <path d="M94 108 C94 70, 110 56, 128 56 C146 56, 162 70, 162 108 C162 136, 147 154, 128 154 C109 154, 94 136, 94 108 Z" fill="url(#skinFem)"/>

  <!-- Subtle Anatomical Ears -->
  <ellipse cx="93" cy="112" rx="5" ry="10" fill="#deb091"/>
  <ellipse cx="163" cy="112" rx="5" ry="10" fill="#deb091"/>

  <!-- Neat Professional Educator Hair (Polished, side-swept front) -->
  <path d="M88 106 C86 68, 102 48, 128 48 C154 48, 170 64, 168 100 C162 84, 150 72, 130 72 C112 72, 98 84, 90 98 C89 101, 88 103, 88 106 Z" fill="#0f172a"/>
  <!-- Hair Highlight Contour -->
  <path d="M106 52 C118 46, 138 46, 150 52 C162 60, 166 72, 166 84 C164 70, 152 58, 138 56 C124 54, 114 56, 106 52 Z" fill="#1e293b"/>
</svg>
