      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="attireFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgFemale)"/>
  
  <!-- Female Shoulders / Professional Saree / Attire -->
  <path d="M35 200 C35 150, 65 136, 100 136 C135 136, 165 150, 165 200 Z" fill="url(#attireFemale)"/>
  
  <!-- Elegant Saree Drape -->
