<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Clean institutional slate -->
    <linearGradient id="bgMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    
    <!-- Torso / Suit Gradient: Executive Dark Slate -->
    <linearGradient id="suitMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Lapel Highlight -->
    <linearGradient id="lapelMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Emerald Tie Gradient matching School Primary Branding -->
    <linearGradient id="tieMale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    
    <!-- Natural Professional Skin Gradient -->
    <linearGradient id="skinMale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eec5a8"/>
      <stop offset="100%" stop-color="#deb091"/>
    </linearGradient>
  </defs>

  <!-- Circular Base Frame -->
  <circle cx="128" cy="128" r="126" fill="url(#bgMale)" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- Male Torso & Shoulders (Executive Suit Cut) -->
  <path d="M40 256 C40 198, 76 174, 128 174 C180 174, 216 198, 216 256 Z" fill="url(#suitMale)"/>

  <!-- Left Lapel / Shoulder Line -->
  <path d="M80 178 L114 236 L100 256 L54 256 C46 235, 58 202, 80 178 Z" fill="url(#lapelMale)"/>
  <!-- Right Lapel / Shoulder Line -->
  <path d="M176 178 L142 236 L156 256 L202 256 C210 235, 198 202, 176 178 Z" fill="url(#lapelMale)"/>

  <!-- Crisp White Shirt Collar -->
  <polygon points="128,174 104,222 152,222" fill="#ffffff"/>

  <!-- Necktie Knot -->
  <polygon points="123,184 133,184 135,195 121,195" fill="#047857"/>
  <!-- Necktie Body -->
  <polygon points="121,195 135,195 138,248 128,256 118,248" fill="url(#tieMale)"/>
  <!-- Tie Shadow Accent -->
  <polygon points="128,195 135,195 138,248 128,256" fill="#022c22" opacity="0.2"/>

  <!-- Neck -->
  <path d="M115 142 L115 180 C120 184, 136 184, 141 180 L141 142 Z" fill="#c99b7b"/>
  <!-- Collar Shadow under Chin -->
  <path d="M115 142 C122 152, 134 152, 141 142 L141 150 C134 158, 122 158, 115 150 Z" fill="#b38263" opacity="0.4"/>

  <!-- Head / Face Silhouette (Faceless Modern Executive) -->
  <path d="M92 106 C92 68, 110 54, 128 54 C146 54, 164 68, 164 106 C164 136, 148 152, 128 152 C108 152, 92 136, 92 106 Z" fill="url(#skinMale)"/>

  <!-- Subtle Anatomical Ears -->
  <ellipse cx="91" cy="110" rx="6" ry="11" fill="#deb091"/>
  <ellipse cx="165" cy="110" rx="6" ry="11" fill="#deb091"/>

  <!-- Professional Executive Haircut (Charcoal/Navy Slate) -->
  <path d="M89 104 C88 66, 104 46, 128 46 C152 46, 168 62, 167 96 C162 86, 154 74, 138 74 C120 74, 108 86, 96 92 C92 95, 90 99, 89 104 Z" fill="#0f172a"/>
  <!-- Hair Depth Shadow -->
  <path d="M96 68 C104 56, 116 50, 128 50 C144 50, 158 58, 164 74 C152 64, 138 60, 124 62 C112 64, 104 70, 96 68 Z" fill="#1e293b"/>
</svg>
